# Optional Render blueprint for the backend (free plan: 512 MB RAM, so deploy a subset).
services:
  - type: web
    name: steam-search-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://steam-search.vercel.app
